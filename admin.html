<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel — ShopNest BD</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,"Noto Sans Bengali",sans-serif;
background:#f4f6f9;
color:#172234;
}

.container{
width:92%;
max-width:1200px;
margin:auto;
}

button{
font-family:inherit;
cursor:pointer;
}

/* HEADER */

.header{
background:#172234;
color:#fff;
padding:16px 0;
}

.header-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.logo{
font-size:24px;
font-weight:800;
}

.logo span{
color:#ed3345;
}

.logout{
border:0;
background:#ed3345;
color:#fff;
padding:10px 16px;
border-radius:8px;
font-weight:bold;
}

/* PAGE */

.page{
padding:25px 0 60px;
}

.title{
margin-bottom:20px;
}

.title h1{
margin:0 0 5px;
font-size:28px;
}

.title p{
margin:0;
color:#687586;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:25px;
}

.stat{
background:#fff;
border:1px solid #e1e5ea;
border-radius:12px;
padding:20px;
}

.stat-icon{
font-size:28px;
}

.stat-label{
color:#687586;
font-size:14px;
margin-top:8px;
}

.stat-value{
font-size:25px;
font-weight:bold;
margin-top:5px;
}

/* CARD */

.card{
background:#fff;
border:1px solid #e1e5ea;
border-radius:14px;
padding:20px;
margin-bottom:20px;
}

.card-title{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:18px;
}

.card-title h2{
margin:0;
}

/* BUTTONS */

.refresh{
border:0;
background:#172234;
color:#fff;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
}

.delete-all{
border:0;
background:#dc3545;
color:#fff;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
}

/* ORDER */

.order{
border:1px solid #dfe4ea;
border-radius:12px;
padding:18px;
margin-bottom:18px;
background:#fafbfd;
}

.order-head{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px;
flex-wrap:wrap;
padding-bottom:15px;
border-bottom:1px solid #e5e7eb;
}

.order-id{
font-size:18px;
font-weight:bold;
}

.order-date{
font-size:12px;
color:#687586;
margin-top:5px;
}

.status{
border:0;
padding:8px 12px;
border-radius:20px;
font-weight:bold;
font-size:12px;
}

/* STATUS COLORS */

.status-pending{
background:#fff0c7;
color:#966500;
}

.status-confirmed{
background:#d9f7e5;
color:#087a3d;
}

.status-shipped{
background:#dceeff;
color:#075b9b;
}

.status-delivered{
background:#d7f5df;
color:#087a3d;
}

.status-cancelled{
background:#ffe0e0;
color:#b42318;
}

/* INFO GRID */

.info-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:0 25px;
}

.info{
padding:12px 0;
border-bottom:1px solid #eee;
}

.label{
display:block;
color:#687586;
font-size:13px;
margin-bottom:5px;
}

.value{
font-weight:bold;
word-break:break-word;
}

/* PRODUCTS */

.products{
padding:14px 0;
border-bottom:1px solid #eee;
}

.product{
padding:6px 0;
}

.total{
display:flex;
justify-content:space-between;
align-items:center;
padding-top:15px;
font-size:21px;
font-weight:bold;
}

/* ACTIONS */

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:16px;
}

.status-select{
border:1px solid #ccd3dc;
background:#fff;
padding:10px;
border-radius:8px;
font-size:14px;
}

.save-status{
border:0;
background:#198754;
color:#fff;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
}

.delete-order{
border:0;
background:#dc3545;
color:#fff;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
}

/* EMPTY */

.empty{
text-align:center;
padding:45px 15px;
color:#687586;
background:#f8fafc;
border-radius:10px;
}

.empty-icon{
font-size:45px;
margin-bottom:10px;
}

/* LOGIN */

.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:#f4f6f9;
}

.login-box{
width:100%;
max-width:400px;
background:#fff;
padding:30px;
border-radius:15px;
border:1px solid #e1e5ea;
box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.login-box h1{
margin-top:0;
text-align:center;
}

.login-box p{
text-align:center;
color:#687586;
}

.login-box input{
width:100%;
padding:13px;
border:1px solid #ccd3dc;
border-radius:8px;
margin:8px 0 15px;
font-size:15px;
}

.login-btn{
width:100%;
border:0;
background:#ed3345;
color:#fff;
padding:13px;
border-radius:8px;
font-weight:bold;
font-size:16px;
}

.error{
display:none;
background:#ffe5e5;
color:#b42318;
padding:10px;
border-radius:8px;
margin-bottom:15px;
text-align:center;
}

/* MOBILE */

@media(max-width:800px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.info-grid{
grid-template-columns:1fr;
}

.header-row{
align-items:flex-start;
}

}

@media(max-width:500px){

.container{
width:94%;
}

.stats{
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
padding:14px;
}

.stat-value{
font-size:21px;
}

.title h1{
font-size:24px;
}

.card{
padding:15px;
}

.order{
padding:14px;
}

.order-head{
flex-direction:column;
}

.total{
font-size:18px;
}

.actions{
flex-direction:column;
}

.status-select,
.save-status,
.delete-order,
.refresh,
.delete-all{
width:100%;
}

}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="loginPage" class="login-page">

<div class="login-box">

<h1>🔐 Admin Login</h1>

<p>ShopNest BD Admin Panel</p>

<div id="loginError" class="error">
ভুল Password!
</div>

<input
id="adminPassword"
type="password"
placeholder="Admin Password"
>

<button
class="login-btn"
onclick="login()"
>
Login
</button>

</div>

</div>


<!-- ADMIN -->

<div id="adminPage" style="display:none;">


<header class="header">

<div class="container header-row">

<div class="logo">
Shop<span>Nest</span> Admin
</div>

<button
class="logout"
onclick="logout()"
>
Logout
</button>

</div>

</header>


<main class="container page">


<div class="title">

<h1>📊 Admin Dashboard</h1>

<p>
ShopNest BD অর্ডার ম্যানেজমেন্ট
</p>

</div>


<!-- STATS -->

<div class="stats">


<div class="stat">

<div class="stat-icon">📦</div>

<div class="stat-label">
মোট অর্ডার
</div>

<div
id="totalOrders"
class="stat-value"
>
0
</div>

</div>


<div class="stat">

<div class="stat-icon">⏳</div>

<div class="stat-label">
Pending
</div>

<div
id="pendingOrders"
class="stat-value"
>
0
</div>

</div>


<div class="stat">

<div class="stat-icon">✅</div>

<div class="stat-label">
Delivered
</div>

<div
id="deliveredOrders"
class="stat-value"
>
0
</div>

</div>


<div class="stat">

<div class="stat-icon">💰</div>

<div class="stat-label">
মোট বিক্রি
</div>

<div
id="totalSales"
class="stat-value"
>
৳ 0
</div>

</div>


</div>


<!-- ORDERS -->

<div class="card">

<div class="card-title">

<h2>📦 অর্ডারসমূহ</h2>

<div>

<button
class="refresh"
onclick="loadOrders()"
>
🔄 Refresh
</button>

</div>

</div>


<div id="orderList">

<div class="empty">

<div class="empty-icon">
📦
</div>

অর্ডার লোড হচ্ছে...

</div>

</div>


</div>


</main>

</div>


<script>

/* =========================
   SETTINGS
========================= */

const ORDER_KEY = "shopnest_orders";

/*
   Demo Admin Password
   পরে অবশ্যই server-side login
   ব্যবহার করা উচিত।
*/

const ADMIN_PASSWORD = "123456";


/* =========================
   MONEY
========================= */

function money(value){

return "৳ " +
Number(value || 0).toLocaleString("en-BD");

}


/* =========================
   LOGIN
========================= */

function login(){

const password =
document.getElementById("adminPassword").value;

const error =
document.getElementById("loginError");


if(password === ADMIN_PASSWORD){

localStorage.setItem(
"shopnest_admin_login",
"yes"
);

error.style.display = "none";

showAdmin();

}else{

error.style.display = "block";

}

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

document.getElementById(
"loginPage"
).style.display = "none";

document.getElementById(
"adminPage"
).style.display = "block";

loadOrders();

}


/* =========================
   LOGOUT
========================= */

function logout(){

localStorage.removeItem(
"shopnest_admin_login"
);

location.reload();

}


/* =========================
   GET ORDERS
========================= */

function getOrders(){

let orders = [];

try{

orders = JSON.parse(
localStorage.getItem(ORDER_KEY) || "[]"
);

if(!Array.isArray(orders)){

orders = [];

}

}catch(error){

orders = [];

}

return orders;

}


/* =========================
   SAVE ORDERS
========================= */

function saveOrders(orders){

localStorage.setItem(
ORDER_KEY,
JSON.stringify(orders)
);

}


/* =========================
   DASHBOARD STATS
========================= */

function updateStats(orders){

let pending = 0;

let delivered = 0;

let sales = 0;


orders.forEach(function(order){

const status =
String(order.status || "Pending")
.toLowerCase();


if(status === "pending"){

pending++;

}


if(status === "delivered"){

delivered++;

}


sales += Number(
order.total || 0
);

});


document.getElementById(
"totalOrders"
).textContent = orders.length;


document.getElementById(
"pendingOrders"
).textContent = pending;


document.getElementById(
"deliveredOrders"
).textContent = delivered;


document.getElementById(
"totalSales"
).textContent = money(sales);

}


/* =========================
   STATUS CLASS
========================= */

function statusClass(status){

const value =
String(status || "Pending")
.toLowerCase();

if(value === "confirmed"){

return "status-confirmed";

}

if(value === "shipped"){

return "status-shipped";

}

if(value === "delivered"){

return "status-delivered";

}

if(value === "cancelled"){

return "status-cancelled";

}

return "status-pending";

}


/* =========================
   LOAD ORDERS
========================= */

function loadOrders(){

const box =
document.getElementById("orderList");

if(!box){

return;

}


const orders = getOrders();

updateStats(orders);


if(orders.length === 0){

box.innerHTML = `

<div class="empty">

<div class="empty-icon">
📦
</div>

কোনো অর্ডার পাওয়া যায়নি।

</div>

`;

return;

}


/* নতুন অর্ডার আগে */

orders.reverse();


let html = "";


orders.forEach(function(order,index){

const items =
Array.isArray(order.items)
? order.items
: [];


let productsHTML = "";


if(items.length){

items.forEach(function(item){

productsHTML += `

<div class="product">

${item.name || "Product"}

× ${Number(item.qty || 1)}

</div>

`;

});

}else{

productsHTML =
"পণ্যের তথ্য পাওয়া যায়নি";

}


const status =
order.status || "Pending";


html += `

<div class="order">

<div class="order-head">

<div>

<div class="order-id">

Order ID:
${order.id || "N/A"}

</div>

<div class="order-date">

${order.date || ""}

</div>

</div>


<span
class="status ${statusClass(status)}"
>

${status}

</span>

</div>


<div class="info-grid">


<div class="info">

<span class="label">
👤 কাস্টমারের নাম
</span>

<span class="value">
${order.name || "N/A"}
</span>

</div>


<div class="info">

<span class="label">
📱 মোবাইল
</span>

<span class="value">
${order.phone || "N/A"}
</span>

</div>


<div class="info">

<span class="label">
📍 জেলা
</span>

<span class="value">
${order.district || "N/A"}
</span>

</div>


<div class="info">

<span class="label">
🏠 ঠিকানা
</span>

<span class="value">
${order.address || "N/A"}
</span>

</div>


<div class="info">

<span class="label">
💳 Payment
</span>

<span class="value">
${order.payment || "N/A"}
</span>

</div>


<div class="info">

<span class="label">
🆔 Order ID
</span>

<span class="value">
${order.id || "N/A"}
</span>

</div>


</div>


<div class="products">

<strong>
📦 পণ্য
</strong>

${productsHTML}

</div>


<div class="total">

<span>
মোট
</span>

<span>
${money(order.total)}
</span>

</div>


<div class="actions">

<select
id="status-${index}"
class="status-select"
>

<option value="Pending"
${status === "Pending" ? "selected" : ""}>
Pending
</option>

<option value="Confirmed"
${status === "Confirmed" ? "selected" : ""}>
Confirmed
</option>

<option value="Shipped"
${status === "Shipped" ? "selected" : ""}>
Shipped
</option>

<option value="Delivered"
${status === "Delivered" ? "selected" : ""}>
Delivered
</option>

<option value="Cancelled"
${status === "Cancelled" ? "selected" : ""}>
Cancelled
</option>

</select>


<button
class="save-status"
onclick="changeStatus(${index})"
>
💾 Status Save
</button>


<button
class="delete-order"
onclick="deleteOrder(${index})"
>
🗑️ Delete
</button>

</div>


</div>

`;

});


box.innerHTML = html;

}


/* =========================
   CHANGE STATUS
========================= */

function changeStatus(index){

const orders = getOrders();

orders.reverse();


if(!orders[index]){

return;

}


const select =
document.getElementById(
"status-" + index
);


if(!select){

return;

}


orders[index].status =
select.value;


saveOrders(orders);

alert(
"অর্ডারের Status সফলভাবে পরিবর্তন হয়েছে।"
);

loadOrders();

}


/* =========================
   DELETE ORDER
========================= */

function deleteOrder(index){

const orders = getOrders();

orders.reverse();


if(!orders[index]){

return;

}


const id =
orders[index].id || "এই অর্ডার";


const confirmDelete =
confirm(
"আপনি কি " +
id +
" অর্ডারটি মুছে ফেলতে চান?"
);


if(!confirmDelete){

return;

}


orders.splice(index,1);

saveOrders(orders);

loadOrders();

}


/* =========================
   ENTER LOGIN
========================= */

document.getElementById(
"adminPassword"
).addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

login();

}

}
);


/* =========================
   START
========================= */

if(
localStorage.getItem(
"shopnest_admin_login"
) === "yes"
){

showAdmin();

}

</script>

</body>
</html>
