<main class="page">

      <a href="index.html">Home</a> /

  </div>

  <a href="wishlist.html">❤️<small>Wishlist</small></a>

</nav>

<script>
const STORE_KEY="shopnest_products_v1";
const CART_KEY="shopnest_cart";
const WISH_KEY="shopnest_wish";
const USER_KEY="shopnest_user";
const ORDER_KEY="shopnest_orders";

const defaultProducts=[
{id:1,name:"TWS ইয়ারবাডস",cat:"electronics",price:990,old:1800,rating:4.6,sale:true,emoji:"🎧"},
{id:2,name:"স্মার্ট ওয়াচ",cat:"electronics",price:1499,old:2500,rating:4.7,sale:true,emoji:"⌚"},
{id:3,name:"ল্যাপটপ ব্যাকপ্যাক",cat:"fashion",price:780,old:1200,rating:4.5,sale:true,emoji:"🎒"},
{id:4,name:"ক্যাজুয়াল স্নিকার্স",cat:"fashion",price:999,old:2000,rating:4.4,sale:true,emoji:"👟"},
{id:5,name:"স্কিন কেয়ার সেট",cat:"beauty",price:455,old:650,rating:4.8,sale:true,emoji:"🧴"},
{id:6,name:"স্মার্টফোন",cat:"electronics",price:15999,old:18500,rating:4.7,sale:false,emoji:"📱"},
{id:7,name:"ওয়্যারলেস হেডফোন",cat:"electronics",price:2200,old:3200,rating:4.6,sale:false,emoji:"🎧"},
{id:8,name:"ড্রেস কালেকশন",cat:"fashion",price:1290,old:1800,rating:4.5,sale:false,emoji:"👗"},
{id:9,name:"এয়ার ফ্রায়ার",cat:"home",price:3990,old:4500,rating:4.6,sale:false,emoji:"🍳"},
{id:10,name:"কিচেন ব্লেন্ডার",cat:"home",price:1850,old:2300,rating:4.3,sale:false,emoji:"🥤"},
{id:11,name:"মেকআপ কিট",cat:"beauty",price:1190,old:1600,rating:4.4,sale:false,emoji:"💄"},
{id:12,name:"বাচ্চাদের খেলনা গাড়ি",cat:"kids",price:850,old:1100,rating:4.7,sale:false,emoji:"🚗"},
{id:13,name:"টেডি বিয়ার",cat:"kids",price:690,old:900,rating:4.8,sale:false,emoji:"🧸"},
{id:14,name:"সানগ্লাস",cat:"fashion",price:650,old:900,rating:4.2,sale:false,emoji:"🕶️"},
{id:15,name:"টেবিল ল্যাম্প",cat:"home",price:950,old:1250,rating:4.5,sale:false,emoji:"💡"}
];

function getProducts(){
  try{
    return JSON.parse(localStorage.getItem(STORE_KEY)) || defaultProducts;
  }catch(e){
    return defaultProducts;
  }
}

function money(n){
  return "৳ " + Number(n).toLocaleString("en-BD");
}

function getCart(){
  try{
    return JSON.parse(localStorage.getItem(CART_KEY) || "[]");
  }catch(e){
    return [];
  }
}

function saveCart(c){
  localStorage.setItem(CART_KEY,JSON.stringify(c));
  updateCounts();
}

function getWish(){
  try{
    return JSON.parse(localStorage.getItem(WISH_KEY) || "[]");
  }catch(e){
    return [];
  }
}

function updateCounts(){
  let c=getCart().reduce((s,x)=>s+Number(x.qty||0),0);
  let w=getWish().length;

  document.querySelectorAll("#cartCount").forEach(e=>{
    e.textContent=c;
  });

  document.querySelectorAll("#wishCount").forEach(e=>{
    e.textContent=w;
  });
}

function toast(t){
  let e=document.createElement("div");
  e.className="toast";
  e.textContent=t;
  document.body.appendChild(e);

  setTimeout(()=>{
    e.remove();
  },1800);
}

function renderTopFooter(){

  let top=document.getElementById("topbar");

  if(top){
    top.innerHTML=`
      <div class="topbar">
        <div class="container">
          <span>সারা বাংলাদেশে ডেলিভারি</span>
          <span>🛡️ নিরাপদ পেমেন্ট &nbsp; • &nbsp; 🔄 সহজ রিটার্ন</span>
          <span>☎ Customer Support: 09612-345678</span>
        </div>
      </div>
    `;
  }

  let f=document.getElementById("footer");

  if(f){
    f.className="footer";

    f.innerHTML=`
      <div class="container footer-grid">

        <div>
          <h3>ShopNest BD</h3>
          <p>
            Shop Smart, Live Better — বাংলাদেশের জন্য আধুনিক অনলাইন শপিং প্ল্যাটফর্ম।
          </p>
        </div>

        <div>
          <h3>দ্রুত লিংক</h3>
          <a href="products.html">সব পণ্য</a>
          <a href="cart.html">কার্ট</a>
          <a href="wishlist.html">Wishlist</a>
        </div>

        <div>
          <h3>সাহায্য</h3>
          <a href="#">শিপিং পলিসি</a>
          <a href="#">রিটার্ন পলিসি</a>
          <a href="#">প্রাইভেসি</a>
        </div>

        <div>
          <h3>যোগাযোগ</h3>
          <p>☎ 09612-345678</p>
          <p>✉ support@shopnest.bd</p>
          <p>📍 Bangladesh</p>
        </div>

      </div>
    `;
  }
}

function initCommon(){

  renderTopFooter();
  updateCounts();

  document.querySelectorAll("#searchForm").forEach(f=>{

    f.addEventListener("submit",e=>{

      e.preventDefault();

      let q=f.querySelector("input").value.trim();

      location.href=
        "products.html"+
        (q ? "?q="+encodeURIComponent(q) : "");

    });

  });
}

function renderCart(){

  let c=getCart();
  let ps=getProducts();

  let items=c
    .map(x=>{
      let p=ps.find(p=>Number(p.id)===Number(x.id));

      if(!p) return null;

      return {
        ...p,
        qty:Number(x.qty)||1
      };
    })
    .filter(x=>x);

  let el=document.getElementById("cartPage");

  if(!el) return;

  if(!items.length){

    el.innerHTML=`
      <div class="empty">

        <div style="font-size:60px">🛒</div>

        <h2>আপনার কার্ট খালি</h2>

        <p>আপনার পছন্দের পণ্য কার্টে যোগ করুন।</p>

        <br>

        <a class="btn primary" href="products.html">
          🛍️ শপিং শুরু করুন
        </a>

      </div>
    `;

    return;
  }

  let sub=items.reduce(
    (s,x)=>s+(Number(x.price)*x.qty),
    0
  );

  let ship=sub>=999 ? 0 : 60;
  let total=sub+ship;

  el.innerHTML=`

    <div class="cart-layout">

      <section>

        ${items.map(x=>`

          <div class="cart-item">

            <div class="mini-img">
              ${x.emoji || "📦"}
            </div>

            <div>

              <strong>${x.name}</strong>

              <div style="margin-top:6px;color:#e7353f;font-weight:bold">
                ${money(x.price)}
              </div>

              <div class="qty">

                <button onclick="changeQty(${x.id},-1)">
                  −
                </button>

                <b>${x.qty}</b>

                <button onclick="changeQty(${x.id},1)">
                  +
                </button>

              </div>

            </div>

            <div class="cart-price">

              <strong>
                ${money(x.price*x.qty)}
              </strong>

              <br><br>

              <button
                class="filter"
                onclick="removeItem(${x.id})">
                🗑️ Remove
              </button>

            </div>

          </div>

        `).join("")}

      </section>

      <aside class="summary">

        <h3>অর্ডার সামারি</h3>

        <div class="sum-row">
          <span>Subtotal</span>
          <b>${money(sub)}</b>
        </div>

        <div class="sum-row">
          <span>Delivery</span>
          <b>${ship ? money(ship) : "Free"}</b>
        </div>

        <div class="sum-row sum-total">
          <span>Total</span>
          <b>${money(total)}</b>
        </div>

        <a
          class="btn primary wide"
          href="checkout.html">
          Checkout →
        </a>

      </aside>

    </div>

  `;
}

function changeQty(id,d){

  let c=getCart();

  let x=c.find(
    i=>Number(i.id)===Number(id)
  );

  if(!x) return;

  x.qty=Number(x.qty)+d;

  if(x.qty<1){

    c=c.filter(
      i=>Number(i.id)!==Number(id)
    );

  }

  saveCart(c);
  renderCart();
}

function removeItem(id){

  let c=getCart().filter(
    x=>Number(x.id)!==Number(id)
  );

  saveCart(c);
  renderCart();

  toast("কার্ট থেকে পণ্য সরানো হয়েছে");
}

document.addEventListener(
  "DOMContentLoaded",
  ()=>{
    initCommon();
    renderCart();
  }
);
</script>
