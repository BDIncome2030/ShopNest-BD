<label>সম্পূর্ণ ঠিকানা<textarea required name="address" placeholder="বাড়ি, রোড, এলাকা"></textarea></label>

<button class="btn primary wide" type="submit">অর্ডার কনফার্ম করুন</button></form></section><aside class="summary" id="checkoutSummary"></aside></div></main>

function getProducts(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||defaultProducts}catch(e){return defaultProducts}}
function saveProducts(p){localStorage.setItem(STORE_KEY,JSON.stringify(p))}
function money(n){return "৳ "+Number(n).toLocaleString("en-BD")}
function getCart(){return JSON.parse(localStorage.getItem(CART_KEY)||"[]")}
function saveCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c));updateCounts()}
function getWish(){return JSON.parse(localStorage.getItem(WISH_KEY)||"[]")}
function saveWish(w){localStorage.setItem(WISH_KEY,JSON.stringify(w));updateCounts()}
function addToCart(id,qty=1){let c=getCart(),x=c.find(i=>i.id==id);if(x)x.qty+=qty;else c.push({id:Number(id),qty});saveCart(c);toast("কার্টে যোগ হয়েছে");}
function toggleWish(id){let w=getWish(),n=Number(id),i=w.indexOf(n);i>=0?w.splice(i,1):w.push(n);saveWish(w);toast(i>=0?"Wishlist থেকে সরানো হয়েছে":"Wishlist-এ যোগ হয়েছে");}
function updateCounts(){let c=getCart().reduce((s,x)=>s+x.qty,0);let w=getWish().length;document.querySelectorAll("#cartCount").forEach(e=>e.textContent=c);document.querySelectorAll("#wishCount").forEach(e=>e.textContent=w)}
function toast(t){let e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function productCard(p){let w=getWish().includes(Number(p.id));return `<article class="product-card"><div class="product-img">${p.emoji||"📦"}${p.sale?`<span class="discount">-${Math.round((1-p.price/p.old)*100)}%</span>`:""}<button class="wish" onclick="toggleWish(${p.id});location.reload()"> ${w?"♥":"♡"} </button></div><div class="product-info"><div class="rating">★ ${p.rating}</div><div class="product-name">${p.name}</div><div><span class="price">${money(p.price)}</span>${p.old?`<span class="old-price">${money(p.old)}</span>`:""}</div><button class="add" onclick="addToCart(${p.id})">🛒 কার্টে যোগ করুন</button><a class="btn secondary wide" style="margin-top:6px;text-align:center" href="product.html?id=${p.id}">বিস্তারিত</a></div></article>`}
function renderTopFooter(){let top=document.getElementById("topbar");if(top)top.innerHTML=`<div class="topbar"><div class="container"><span>সারা বাংলাদেশে ডেলিভারি</span><span>🛡️ নিরাপদ পেমেন্ট &nbsp; • &nbsp; 🔄 সহজ রিটার্ন</span><span>☎ Customer Support: 09612-345678</span></div></div>`;let f=document.getElementById("footer");if(f)f.className="footer",f.innerHTML=`<div class="container footer-grid"><div><h3>ShopNest BD</h3><p>Shop Smart, Live Better — বাংলাদেশের জন্য আধুনিক অনলাইন শপিং প্ল্যাটফর্ম।</p></div><div><h3>দ্রুত লিংক</h3><a href="products.html">সব পণ্য</a><a href="cart.html">কার্ট</a><a href="wishlist.html">Wishlist</a></div><div><h3>সাহায্য</h3><a href="#">শিপিং পলিসি</a><a href="#">রিটার্ন পলিসি</a><a href="#">প্রাইভেসি</a></div><div><h3>যোগাযোগ</h3><p>☎ 09612-345678</p><p>✉ support@shopnest.bd</p><p>📍 Bangladesh</p></div></div>`}
function initCommon(){renderTopFooter();updateCounts();document.querySelectorAll("#searchForm").forEach(f=>f.addEventListener("submit",e=>{e.preventDefault();let q=f.querySelector("input").value.trim();location.href="products.html"+(q?"?q="+encodeURIComponent(q):"")}))}

function getProducts(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||defaultProducts}catch(e){return defaultProducts}}
function saveProducts(p){localStorage.setItem(STORE_KEY,JSON.stringify(p))}
function money(n){return "৳ "+Number(n).toLocaleString("en-BD")}
function getCart(){return JSON.parse(localStorage.getItem(CART_KEY)||"[]")}
function saveCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c));updateCounts()}
function getWish(){return JSON.parse(localStorage.getItem(WISH_KEY)||"[]")}
function saveWish(w){localStorage.setItem(WISH_KEY,JSON.stringify(w));updateCounts()}
function addToCart(id,qty=1){let c=getCart(),x=c.find(i=>i.id==id);if(x)x.qty+=qty;else c.push({id:Number(id),qty});saveCart(c);toast("কার্টে যোগ হয়েছে");}
function toggleWish(id){let w=getWish(),n=Number(id),i=w.indexOf(n);i>=0?w.splice(i,1):w.push(n);saveWish(w);toast(i>=0?"Wishlist থেকে সরানো হয়েছে":"Wishlist-এ যোগ হয়েছে");}
function updateCounts(){let c=getCart().reduce((s,x)=>s+x.qty,0);let w=getWish().length;document.querySelectorAll("#cartCount").forEach(e=>e.textContent=c);document.querySelectorAll("#wishCount").forEach(e=>e.textContent=w)}
function toast(t){let e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function productCard(p){let w=getWish().includes(Number(p.id));return `<article class="product-card"><div class="product-img">${p.emoji||"📦"}${p.sale?`<span class="discount">-${Math.round((1-p.price/p.old)*100)}%</span>`:""}<button class="wish" onclick="toggleWish(${p.id});location.reload()"> ${w?"♥":"♡"} </button></div><div class="product-info"><div class="rating">★ ${p.rating}</div><div class="product-name">${p.name}</div><div><span class="price">${money(p.price)}</span>${p.old?`<span class="old-price">${money(p.old)}</span>`:""}</div><button class="add" onclick="addToCart(${p.id})">🛒 কার্টে যোগ করুন</button><a class="btn secondary wide" style="margin-top:6px;text-align:center" href="product.html?id=${p.id}">বিস্তারিত</a></div></article>`}

function initCommon(){renderTopFooter();updateCounts();document.querySelectorAll("#searchForm").forEach(f=>f.addEventListener("submit",e=>{e.preventDefault();let q=f.querySelector("input").value.trim();location.href="products.html"+(q?"?q="+encodeURIComponent(q):"")}))}
document.addEventListener("DOMContentLoaded",initCommon);
\ndocument.addEventListener("DOMContentLoaded",()=>{let c=getCart(),ps=getProducts(),items=c.map(x=>({...ps.find(p=>p.id===x.id),qty:x.qty})).filter(x=>x.name),sum=items.reduce((s,x)=>s+x.price*x.qty,0),ship=sum>=999?0:60;document.getElementById("checkoutSummary").innerHTML=`<h3>অর্ডার সামারি</h3>${items.map(x=>`<div class="sum-row"><span>${x.name} × ${x.qty}</span><b>${money(x.price*x.qty)}</b></div>`).join("")}<div class="sum-row"><span>Delivery</span><b>${ship?money(ship):"Free"}</b></div><div class="sum-row sum-total"><span>Total</span><b>${money(sum+ship)}</b></div>`;document.getElementById("checkoutForm").onsubmit=e=>{e.preventDefault();if(!items.length){toast("কার্ট খালি");return}let f=new FormData(e.target),orders=JSON.parse(localStorage.getItem(ORDER_KEY)||"[]"),order={id:"SN"+Date.now(),date:new Date().toLocaleString("bn-BD"),name:f.get("name"),phone:f.get("phone"),district:f.get("district"),address:f.get("address"),payment:f.get("payment"),items,total:sum+ship,status:"Pending"};orders.unshift(order);localStorage.setItem(ORDER_KEY,JSON.stringify(orders));localStorage.removeItem(CART_KEY);alert(`অর্ডার সফল হয়েছে!\\nOrder ID: ${order.id}`);location.href="account.html"}})\n</script>\n</body></html>
