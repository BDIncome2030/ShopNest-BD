<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - ShopNest BD</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f5f7fa;
  color:#182230;
}

header{
  background:#fff;
  padding:14px 24px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:20;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:30px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{color:#08a56c}

.icons{
  display:flex;
  gap:18px;
  align-items:center;
  font-size:30px;
}

.icon{
  position:relative;
  cursor:pointer;
}

.badge{
  position:absolute;
  top:-8px;
  right:-10px;
  background:#ef3349;
  color:#fff;
  border-radius:50%;
  font-size:13px;
  min-width:25px;
  height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.search{
  max-width:1200px;
  margin:12px auto 0;
  display:flex;
  border:2px solid #ddd;
  border-radius:35px;
  overflow:hidden;
  background:#fff;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  padding:14px 20px;
  font-size:20px;
}

.search button{
  width:110px;
  border:0;
  background:#08a56c;
  color:#fff;
  font-size:25px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px 100px;
}

.breadcrumb{
  color:#08a56c;
  font-size:20px;
  margin-bottom:20px;
}

h1{
  font-size:34px;
  margin:10px 0 25px;
}

.filters{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.filter{
  border:1px solid #ddd;
  background:#fff;
  padding:10px 20px;
  border-radius:25px;
  font-size:18px;
  cursor:pointer;
}

.filter.active{
  background:#ef3349;
  color:#fff;
}

.sort{
  padding:10px 18px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:17px;
  background:#fff;
}

.count{
  color:#687386;
  font-size:20px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid #ddd;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.product-img{
  height:230px;
  background:#f1f4f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:105px;
}

.wish{
  position:absolute;
  right:14px;
  top:14px;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#fff;
  font-size:27px;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.wish.active{
  color:#ef3349;
}

.info{
  padding:18px;
}

.name{
  font-size:23px;
  font-weight:700;
  min-height:58px;
}

.rating{
  color:#f5b900;
  font-size:18px;
  margin:8px 0;
}

.price{
  color:#ef3349;
  font-size:25px;
  font-weight:800;
}

.old{
  color:#999;
  text-decoration:line-through;
  margin-left:7px;
  font-size:17px;
}

.cat{
  color:#687386;
  margin:8px 0 14px;
  font-size:17px;
}

.buttons{
  display:flex;
  gap:8px;
}

.details{
  flex:1;
  text-align:center;
  padding:12px 5px;
  border:2px solid #ef3349;
  color:#ef3349;
  background:#fff;
  border-radius:12px;
  font-size:17px;
  font-weight:700;
  text-decoration:none;
}

.cart{
  flex:1;
  border:0;
  background:#ef3349;
  color:#fff;
  border-radius:12px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
}

.bottom a{
  text-decoration:none;
  color:#182230;
  text-align:center;
  font-size:14px;
}

.bottom span{
  display:block;
  font-size:27px;
}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:600px){
  .logo{font-size:24px}
  .icons{font-size:25px;gap:10px}
  .container{padding:20px 15px 90px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .product-img{height:180px;font-size:75px}
  .info{padding:12px}
  .name{font-size:18px;min-height:48px}
  .price{font-size:20px}
  .details,.cart{font-size:14px;padding:10px 3px}
  h1{font-size:28px}
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">
      🛍️ ShopNest <span>BD</span>
    </div>

    <div class="icons">
      <div class="icon" onclick="goWishlist()">❤️
        <span class="badge" id="wishCount">0</span>
      </div>

      <div class="icon" onclick="goCart()">🛒
        <span class="badge" id="cartCount">0</span>
      </div>

      <div class="icon" onclick="goAccount()">👤</div>
    </div>

  </div>

  <form class="search" onsubmit="searchProducts(event)">
    <input id="searchInput" placeholder="কি খুঁজছেন?">
    <button>🔍</button>
  </form>
</header>


<main class="container">

  <div class="breadcrumb">
    Home / Products
  </div>

  <h1>🛍️ সব পণ্য</h1>

  <div class="filters">

    <button class="filter active" onclick="filterProducts('all',this)">
      সব
    </button>

    <button class="filter" onclick="filterProducts('electronics',this)">
      ইলেকট্রনিক্স
    </button>

    <button class="filter" onclick="filterProducts('fashion',this)">
      ফ্যাশন
    </button>

    <button class="filter" onclick="filterProducts('beauty',this)">
      বিউটি
    </button>

    <button class="filter" onclick="filterProducts('home',this)">
      হোম
    </button>

    <button class="filter" onclick="filterProducts('kids',this)">
      কিডস
    </button>

    <select class="sort" onchange="sortProducts(this.value)">
      <option value="default">সাজানো</option>
      <option value="low">কম দাম</option>
      <option value="high">বেশি দাম</option>
      <option value="rating">রেটিং</option>
    </select>

  </div>

  <div class="count" id="count">15টি পণ্য পাওয়া গেছে</div>

  <div class="grid" id="productGrid"></div>

</main>


<div class="bottom">
  <a href="index.html">
    <span>🏠</span>Home
  </a>

  <a href="products.html">
    <span>🛍️</span>Products
  </a>

  <a href="cart.html">
    <span>🛒</span>Cart
  </a>

  <a href="account.html">
    <span>👤</span>Account
  </a>
</div>


<script>

const CART_KEY = "shopnest_cart";
const WISH_KEY = "shopnest_wish";

const products = [

{id:1,name:"TWS ইয়ারবাডস",cat:"electronics",price:990,old:1800,rating:4.6,emoji:"🎧"},

{id:2,name:"স্মার্ট ওয়াচ",cat:"electronics",price:1499,old:2500,rating:4.7,emoji:"⌚"},

{id:3,name:"ল্যাপটপ ব্যাকপ্যাক",cat:"fashion",price:780,old:1200,rating:4.5,emoji:"🎒"},

{id:4,name:"ক্যাজুয়াল স্নিকার্স",cat:"fashion",price:999,old:2000,rating:4.4,emoji:"👟"},

{id:5,name:"স্কিন কেয়ার সেট",cat:"beauty",price:455,old:650,rating:4.8,emoji:"🧴"},

{id:6,name:"স্মার্টফোন",cat:"electronics",price:15999,old:18500,rating:4.7,emoji:"📱"},

{id:7,name:"ওয়্যারলেস হেডফোন",cat:"electronics",price:2200,old:3200,rating:4.6,emoji:"🎧"},

{id:8,name:"ড্রেস কালেকশন",cat:"fashion",price:1290,old:1800,rating:4.5,emoji:"👗"},

{id:9,name:"এয়ার ফ্রায়ার",cat:"home",price:3990,old:4500,rating:4.6,emoji:"🍳"},

{id:10,name:"কিচেন ব্লেন্ডার",cat:"home",price:1850,old:2300,rating:4.3,emoji:"🥤"},

{id:11,name:"মেকআপ কিট",cat:"beauty",price:1190,old:1600,rating:4.4,emoji:"💄"},

{id:12,name:"বাচ্চাদের খেলনা গাড়ি",cat:"kids",price:850,old:1100,rating:4.7,emoji:"🚗"},

{id:13,name:"টেডি বিয়ার",cat:"kids",price:690,old:900,rating:4.8,emoji:"🧸"},

{id:14,name:"সানগ্লাস",cat:"fashion",price:650,old:900,rating:4.2,emoji:"🕶️"},

{id:15,name:"টেবিল ল্যাম্প",cat:"home",price:950,old:1250,rating:4.5,emoji:"💡"}

];


let currentProducts = [...products];
let currentCategory = "all";


function getCart(){
  try{
    return JSON.parse(localStorage.getItem(CART_KEY)) || [];
  }catch(e){
    return [];
  }
}


function getWish(){
  try{
    return JSON.parse(localStorage.getItem(WISH_KEY)) || [];
  }catch(e){
    return [];
  }
}


function updateCounts(){

  const cart = getCart();

  const totalQty = cart.reduce(
    (sum,item)=>sum + Number(item.qty || 0),
    0
  );

  document.getElementById("cartCount").textContent = totalQty;

  document.getElementById("wishCount").textContent =
    getWish().length;
}


function render(){

  const grid = document.getElementById("productGrid");

  grid.innerHTML = "";

  document.getElementById("count").textContent =
    currentProducts.length + "টি পণ্য পাওয়া গেছে";


  currentProducts.forEach(p=>{

    const wish = getWish().includes(p.id);

    const discount = Math.round(
      ((p.old-p.price)/p.old)*100
    );


    const card = document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <div class="product-img">
        ${p.emoji}
      </div>

      <button
        class="wish ${wish ? "active" : ""}"
        onclick="toggleWish(${p.id})">
        ${wish ? "❤️" : "♡"}
      </button>

      <div class="info">

        <div class="name">
          ${p.name}
        </div>

        <div class="rating">
          ⭐ ${p.rating}
        </div>

        <div class="price">
          ৳ ${p.price.toLocaleString("bn-BD")}
          <span class="old">
            ৳ ${p.old.toLocaleString("bn-BD")}
          </span>
        </div>

        <div class="cat">
          ${catName(p.cat)}
        </div>

        <div class="buttons">

          <!-- নতুন Product Details পেজ -->
          <a
            class="details"
            href="product-details.html?id=${p.id}">
            👁 বিস্তারিত
          </a>

          <button
            class="cart"
            onclick="addToCart(${p.id})">
            🛒 কার্ট
          </button>

        </div>

      </div>
    `;

    grid.appendChild(card);

  });

  updateCounts();
}


function catName(cat){

  const names = {
    electronics:"ইলেকট্রনিক্স",
    fashion:"ফ্যাশন",
    beauty:"বিউটি",
    home:"হোম",
    kids:"কিডস"
  };

  return names[cat] || cat;
}


function addToCart(id){

  let cart = getCart();

  const existing = cart.find(x=>Number(x.id)===Number(id));

  if(existing){
    existing.qty = Number(existing.qty || 0) + 1;
  }else{
    cart.push({
      id:id,
      qty:1
    });
  }

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  updateCounts();

  alert("✅ পণ্যটি কার্টে যোগ হয়েছে!");
}


function toggleWish(id){

  let wish = getWish();

  const index = wish.indexOf(id);

  if(index === -1){
    wish.push(id);
    alert("❤️ Wishlist-এ যোগ হয়েছে!");
  }else{
    wish.splice(index,1);
    alert("Wishlist থেকে সরানো হয়েছে");
  }

  localStorage.setItem(
    WISH_KEY,
    JSON.stringify(wish)
  );

  render();
}


function filterProducts(cat,btn){

  currentCategory = cat;

  document.querySelectorAll(".filter")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");

  if(cat === "all"){
    currentProducts = [...products];
  }else{
    currentProducts = products.filter(
      p=>p.cat === cat
    );
  }

  render();
}


function sortProducts(type){

  if(type === "low"){
    currentProducts.sort(
      (a,b)=>a.price-b.price
    );
  }

  else if(type === "high"){
    currentProducts.sort(
      (a,b)=>b.price-a.price
    );
  }

  else if(type === "rating"){
    currentProducts.sort(
      (a,b)=>b.rating-a.rating
    );
  }

  else{
    currentProducts = currentProducts
      .slice()
      .sort((a,b)=>a.id-b.id);
  }

  render();
}


function searchProducts(e){

  e.preventDefault();

  const q =
    document.getElementById("searchInput")
    .value
    .trim();

  if(!q){
    currentProducts =
      currentCategory === "all"
      ? [...products]
      : products.filter(
          p=>p.cat===currentCategory
        );

    render();
    return;
  }

  currentProducts = products.filter(p=>
    p.name.toLowerCase().includes(q.toLowerCase()) ||
    catName(p.cat).includes(q)
  );

  render();
}


function goCart(){
  location.href = "cart.html";
}


function goWishlist(){

  /*
    আপনার আলাদা wishlist.html থাকলে
    এখানে wishlist.html করতে পারবেন।
  */

  alert(
    "❤️ Wishlist: " +
    getWish().length +
    "টি পণ্য"
  );
}


function goAccount(){
  location.href = "account.html";
}


render();

</script>

</body>
</html>
