<body>

  <div id="topbar"></div>

  <main class="container">

    <h1>🛍️ সব পণ্য</h1>

    <div id="filterRow"></div>

    <div id="resultText"></div>

    <select id="sort">
      <option value="">সাজান</option>
      <option value="low">কম দাম</option>
      <option value="high">বেশি দাম</option>

<script>
const STORE_KEY = "shopnest_products_v1";
const CART_KEY = "shopnest_cart";
const WISH_KEY = "shopnest_wish";

const defaultProducts = [
  {id:1,name:"TWS ইয়ারবাডস",cat:"electronics",price:990,old:1800,rating:4.6,sale:true,emoji:"🎧"},

  {id:4,name:"ক্যাজুয়াল স্নিকার্স",cat:"fashion",price:999,old:2000,rating:4.4,sale:true,emoji:"👟"},

  {id:8,name:"ড্রেস কালেকশন",cat:"fashion",price:1290,old:1800,rating:4.5,sale:false,emoji:"👗"},
  {id:9,name:"এয়ার ফ্রায়ার",cat:"home",price:3990,old:4500,rating:4.6,sale:false,emoji:"🍳"},
  {id:10,name:"কিচেন ব্লেন্ডার",cat:"home",price:1850,old:2300,rating:4.3,sale:false,emoji:"🥤"},
  {id:11,name:"মেকআপ কিট",cat:"beauty",price:1190,old:1600,rating:4.4,sale:false,emoji:"💄"},
  {id:12,name:"বাচ্চাদের খেলনা গাড়ি",cat:"kids",price:850,old:1100,rating:4.7,sale:false,emoji:"🚗"},
  {id:13,name:"টেডি বিয়ার",cat:"kids",price:690,old:900,rating:4.8,sale:false,emoji:"🧸"},
  {id:14,name:"সানগ্লাস",cat:"fashion",price:650,old:900,rating:4.2,sale:false,emoji:"🕶️"},
  {id:15,name:"টেবিল ল্যাম্প",cat:"home",price:950,old:1250,rating:4.5,sale:false,emoji:"💡"}
];

const categories = [
  {key:"electronics",name:"মোবাইল ও ইলেকট্রনিক্স",short:"ইলেকট্রনিক্স",emoji:"📱"},
  {key:"fashion",name:"ফ্যাশন ও পোশাক",short:"ফ্যাশন",emoji:"👗"},
  {key:"home",name:"কম্পিউটার ও গ্যাজেট",short:"হোম",emoji:"💻"},
  {key:"beauty",name:"বিউটি ও পার্সোনাল কেয়ার",short:"বিউটি",emoji:"💄"},
  {key:"kids",name:"বাচ্চাদের পণ্য",short:"কিডস",emoji:"🧸"}
];

function getProducts(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    return Array.isArray(saved) && saved.length ? saved : defaultProducts;
  }catch(e){
    return defaultProducts;
  }
}

function getCart(){
  try{
    return JSON.parse(localStorage.getItem(CART_KEY) || "[]");
  }catch(e){
    return [];
  }
}

function saveCart(cart){
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateCounts();
}

function getWish(){
  try{
    return JSON.parse(localStorage.getItem(WISH_KEY) || "[]");
  }catch(e){
    return [];
  }
}

function saveWish(wish){
  localStorage.setItem(WISH_KEY, JSON.stringify(wish));
  updateCounts();
}

function money(n){
  return "৳ " + Number(n).toLocaleString("en-BD");
}

function addToCart(id){
  const cart = getCart();
  const productId = Number(id);
  const item = cart.find(x => Number(x.id) === productId);

  if(item){
    item.qty = Number(item.qty || 0) + 1;
  }else{
    cart.push({
      id: productId,
      qty: 1
    });
  }

  saveCart(cart);
  toast("কার্টে যোগ হয়েছে");
}

function toggleWish(id){
  const wish = getWish();
  const productId = Number(id);
  const index = wish.indexOf(productId);

  if(index >= 0){
    wish.splice(index,1);
    toast("Wishlist থেকে সরানো হয়েছে");
  }else{
    wish.push(productId);
    toast("Wishlist-এ যোগ হয়েছে");
  }

  saveWish(wish);
  renderProducts();
}

function updateCounts(){
  const cartCount = getCart().reduce(
    (sum,item) => sum + Number(item.qty || 0),
    0
  );

  const wishCount = getWish().length;

  document.querySelectorAll("#cartCount").forEach(el=>{
    el.textContent = cartCount;
  });

  document.querySelectorAll("#wishCount").forEach(el=>{
    el.textContent = wishCount;
  });
}

function toast(text){
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  document.body.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },1800);
}

  const top = document.getElementById("topbar");

  if(top){
    top.innerHTML = `
      <div class="topbar">
        <div class="container">
          <span>সারা বাংলাদেশে ডেলিভারি</span>
          <span>🛡️ নিরাপদ পেমেন্ট • 🔄 সহজ রিটার্ন</span>
          <span>☎ Customer Support: 09612-345678</span>
        </div>
      </div>
    `;
  }

  const footer = document.getElementById("footer");

  if(footer){
    footer.className = "footer";

    footer.innerHTML = `
      <div class="container footer-grid">

        <div>
          <h3>ShopNest BD</h3>
          <p>
            Shop Smart, Live Better — বাংলাদেশের জন্য আধুনিক অনলাইন শপিং প্ল্যাটফর্ম।
          </p>
        </div>

        <div>
          <h3>দ্রুত লিংক</h3>
          <a href="products.html">সব পণ্য</a>
          <a href="cart.html">কার্ট</a>
          <a href="wishlist.html">Wishlist</a>
        </div>

        <div>
          <h3>সাহায্য</h3>
          <a href="#">শিপিং পলিসি</a>
          <a href="#">রিটার্ন পলিসি</a>
          <a href="#">প্রাইভেসি</a>
        </div>

        <div>
          <h3>যোগাযোগ</h3>
          <p>☎ 09612-345678</p>
          <p>✉ support@shopnest.bd</p>
          <p>📍 Bangladesh</p>
        </div>

      </div>
    `;
  }
}

function productCard(product){

  const wish = getWish().includes(Number(product.id));

  const discount = product.old
    ? Math.round((1 - product.price / product.old) * 100)
    : 0;

  return `
    <article class="product-card">

      <div class="product-img">

        ${product.emoji || "📦"}

        ${
          product.sale
          ? `<span class="discount">-${discount}%</span>`
          : ""
        }

        <button
          class="wish"
          onclick="toggleWish(${product.id})">
          ${wish ? "♥" : "♡"}
        </button>

      </div>

      <div class="product-info">

        <div class="rating">
          ★ ${product.rating}
        </div>

        <div class="product-name">
          ${product.name}
        </div>

        <div>
          <span class="price">
            ${money(product.price)}
          </span>

          ${
            product.old
            ? `<span class="old-price">${money(product.old)}</span>`
            : ""
          }
        </div>

        <button
          class="add"
          onclick="addToCart(${product.id})">
          🛒 কার্টে যোগ করুন
        </button>

        <a
          class="btn secondary wide"
          style="margin-top:6px;text-align:center"
          href="product.html?id=${product.id}">
          বিস্তারিত
        </a>

      </div>

    </article>
  `;
}

let allProducts = [];
let currentCategory = "";

function renderProducts(){

  const grid = document.getElementById("productGrid");
  const resultText = document.getElementById("resultText");

  if(!grid) return;

  const params = new URLSearchParams(location.search);

  const query =
    (params.get("q") || "").toLowerCase();

  const saleOnly =
    params.get("filter") === "sale";

  const sort =
    document.getElementById("sort");

  let products = allProducts.filter(product=>{

    const name =
      String(product.name || "").toLowerCase();

    const matchSearch =
      !query || name.includes(query);

    const matchCategory =
      !currentCategory ||
      product.cat === currentCategory;

    const matchSale =
      !saleOnly || product.sale;

    return matchSearch &&
           matchCategory &&
           matchSale;
  });

  if(sort){

    if(sort.value === "low"){
      products.sort((a,b)=>a.price-b.price);
    }

    if(sort.value === "high"){
      products.sort((a,b)=>b.price-a.price);
    }

    if(sort.value === "rating"){
      products.sort((a,b)=>b.rating-a.rating);
    }
  }

  if(resultText){
    resultText.textContent =
      products.length + "টি পণ্য পাওয়া গেছে";
  }

  if(products.length){
    grid.innerHTML =
      products.map(productCard).join("");
  }else{
    grid.innerHTML = `
      <div class="empty">
        কোনো পণ্য পাওয়া যায়নি।
      </div>
    `;
  }
}

function createFilters(){

  const filterRow =
    document.getElementById("filterRow");

  if(!filterRow) return;

  const buttons = [
    {key:"",name:"সব"},
    ...categories
  ];

  filterRow.innerHTML =
    buttons.map(category=>`
      <button
        class="filter ${category.key === "" ? "active" : ""}"
        data-cat="${category.key}">
        ${category.name || category.short}
      </button>
    `).join("");

  filterRow.querySelectorAll(".filter")
    .forEach(button=>{

      button.addEventListener("click",()=>{

        currentCategory =
          button.dataset.cat;

        filterRow.querySelectorAll(".filter")
          .forEach(btn=>{
            btn.classList.remove("active");
          });

        button.classList.add("active");

        renderProducts();
      });

    });
}

function init(){

  allProducts = getProducts();

  renderTopFooter();
  updateCounts();
  createFilters();
  renderProducts();

  const sort =
    document.getElementById("sort");

  if(sort){
    sort.addEventListener(
      "change",
      renderProducts
    );
  }

  const searchForm =
    document.getElementById("searchForm");

  if(searchForm){

    searchForm.addEventListener("submit",e=>{

      e.preventDefault();

      const input =
        document.getElementById("searchInput");

      const query =
        input ? input.value.trim() : "";

      location.href =
        "products.html" +
        (query
          ? "?q=" + encodeURIComponent(query)
          : "");
    });
  }
}

document.addEventListener(
  "DOMContentLoaded",
  init
);
</script>
</body>
</html>
