<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Products — ShopNest BD</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    color:#182230;
    background:#f7f9fc;
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}


/* =========================
   HEADER
========================= */

.header{
    background:#fff;
    border-bottom:1px solid #e5e7eb;
}

.header-row{
    min-height:74px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
}

.logo{
    font-size:24px;
    font-weight:800;
    white-space:nowrap;
}

.logo-mark{
    display:inline-grid;
    place-items:center;
    width:30px;
    height:30px;
    border-radius:9px;
    background:#ed3345;
    color:#fff;
}

.logo span:last-child{
    color:#ed3345;
}


/* SEARCH */

.search{
    display:flex;
    flex:1;
    max-width:560px;
    border:1px solid #ddd;
    border-radius:25px;
    overflow:hidden;
    background:#fff;
}

.search input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    padding:13px 17px;
    font-size:15px;
}

.search button{
    width:58px;
    border:0;
    background:#ed3345;
    color:#fff;
    font-size:20px;
}


/* ACTIONS */

.actions{
    display:flex;
    gap:14px;
    margin-left:auto;
}

.actions a{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:19px;
}

.actions small{
    font-size:10px;
    margin-top:2px;
}

.badge{
    background:#ed3345;
    color:#fff;
    border-radius:20px;
    padding:2px 6px;
    font-size:10px;
    margin-top:2px;
}


/* =========================
   PAGE
========================= */

.page{
    padding:25px 0 90px;
}

.breadcrumb{
    color:#888;
    font-size:14px;
    margin-bottom:12px;
}

.breadcrumb a{
    color:#ed3345;
}

.page-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.page-title h1{
    margin:0;
    font-size:30px;
}


/* =========================
   CONTROLS
========================= */

.controls{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.filter{
    border:1px solid #ddd;
    background:#fff;
    color:#182230;
    padding:9px 15px;
    border-radius:22px;
    font-size:14px;
}

.filter:hover{
    border-color:#ed3345;
}

.filter.active{
    background:#ed3345;
    color:#fff;
    border-color:#ed3345;
}

#sort{
    margin-left:auto;
    padding:9px 13px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fff;
    outline:none;
}


/* RESULT */

#resultText{
    color:#687586;
    font-size:14px;
    margin-bottom:15px;
}


/* =========================
   PRODUCT GRID
========================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.product-card{
    background:#fff;
    border:1px solid #e2e6eb;
    border-radius:14px;
    overflow:hidden;
    transition:.2s;
}

.product-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}


/* IMAGE */

.product-image{
    height:190px;
    background:#f4f6f9;
    display:grid;
    place-items:center;
    font-size:75px;
    position:relative;
}

.wish-btn{
    position:absolute;
    right:10px;
    top:10px;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    font-size:20px;
}

.wish-btn.active{
    color:#ed3345;
}


/* INFO */

.product-info{
    padding:14px;
}

.product-name{
    font-size:16px;
    font-weight:bold;
    min-height:42px;
    line-height:1.4;
}

.rating{
    color:#f39a00;
    font-size:13px;
    margin:6px 0;
}

.price-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:5px;
}

.price{
    color:#e7353f;
    font-size:20px;
    font-weight:bold;
}

.old-price{
    color:#999;
    font-size:12px;
    text-decoration:line-through;
}

.category{
    color:#687586;
    font-size:12px;
    margin-top:6px;
}


/* BUTTONS */

.product-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:11px;
}

.details-btn{
    border:1px solid #ed3345;
    background:#fff;
    color:#ed3345;
    padding:10px 6px;
    border-radius:8px;
    font-weight:bold;
}

.add-btn{
    border:0;
    background:#ed3345;
    color:#fff;
    padding:10px 6px;
    border-radius:8px;
    font-weight:bold;
}

.add-btn:active,
.details-btn:active{
    transform:scale(.98);
}


/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    background:#fff;
    border:1px solid #e5e8ec;
    border-radius:14px;
}

.empty-icon{
    font-size:60px;
    margin-bottom:10px;
}

.empty h2{
    margin:8px 0;
}

.empty p{
    color:#687586;
}


/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1000;
    padding:20px;
    overflow:auto;
}

.modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-box{
    width:100%;
    max-width:650px;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    position:relative;
    box-shadow:0 15px 50px rgba(0,0,0,.2);
}

.modal-close{
    position:absolute;
    right:12px;
    top:12px;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    font-size:20px;
    z-index:2;
}

.modal-image{
    height:250px;
    background:#f4f6f9;
    display:grid;
    place-items:center;
    font-size:100px;
}

.modal-content{
    padding:22px;
}

.modal-content h2{
    margin:0 0 8px;
}

.modal-rating{
    color:#f39a00;
    margin:8px 0;
}

.modal-price{
    color:#e7353f;
    font-size:25px;
    font-weight:bold;
}

.modal-old{
    color:#999;
    text-decoration:line-through;
    font-size:13px;
    margin-left:7px;
}

.modal-description{
    color:#687586;
    line-height:1.7;
    margin:15px 0;
}

.modal-add{
    width:100%;
    border:0;
    background:#ed3345;
    color:#fff;
    padding:13px;
    border-radius:9px;
    font-weight:bold;
    font-size:16px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom{
    display:none;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:950px){

    .product-grid{
        grid-template-columns:repeat(3,1fr);

@media(max-width:700px){

    body{

    }

    .product-buttons{

    }

    #sort{

    .bottom{

        right:0;
        bottom:0;

    }

    .bottom small{
        font-size:10px;
        margin-top:3px;

@media(max-width:430px){

    }

    .actions a{
        font-size:16px;
    }

    }

    .page-title h1{
        font-size:23px;
    }

    .filter{
        padding:8px 11px;
        font-size:12px;
    }

    .product-image{
        height:125px;
    }

}

</style>
</head>

/* =========================
   PRODUCTS
========================= */

let products = [];


/* =========================
   MONEY
========================= */

function money(value){

return "৳ " +
Number(value || 0).toLocaleString("en-BD");

}


/* =========================
   CART
========================= */

function getCart(){

try{

const data =
JSON.parse(
localStorage.getItem(CART_KEY) || "[]"
);

return Array.isArray(data)
? data
: [];

}catch(error){

return [];

}

}


function saveCart(cart){

localStorage.setItem(
CART_KEY,
JSON.stringify(cart)
);

updateCounts();

}


/* =========================
   WISHLIST
========================= */

function getWish(){

try{

const data =
JSON.parse(
localStorage.getItem(WISH_KEY) || "[]"
);

return Array.isArray(data)
? data
: [];

}catch(error){

return [];

}

}


function saveWish(wish){

localStorage.setItem(
WISH_KEY,
JSON.stringify(wish)
);

updateCounts();

}


/* =========================
   COUNTS
========================= */

function updateCounts(){

const cart = getCart();

const cartTotal =
cart.reduce(
function(total,item){

return total +
Number(item.qty || 0);

},
0
);


const cartCount =
document.getElementById("cartCount");

if(cartCount){

cartCount.textContent =
cartTotal;

}


const wishCount =
document.getElementById("wishCount");

if(wishCount){

wishCount.textContent =
getWish().length;

}

}


/* =========================
   LOAD PRODUCTS
========================= */

function loadProducts(){

let saved = null;

try{

saved =
JSON.parse(
localStorage.getItem(PRODUCT_KEY)
);

}catch(error){

saved = null;

}


if(
Array.isArray(saved) &&
saved.length > 0
){

products = saved;

}else{

products =
defaultProducts.map(
function(product){

return {
...product
};

}
);

}


renderProducts();

}


/* =========================
   ADD TO CART
========================= */

function addToCart(id){

const product =
products.find(
function(item){

return Number(item.id) === Number(id);

}
);


if(!product){

alert("পণ্য পাওয়া যায়নি।");

return;

}


const cart = getCart();


const existing =
cart.find(
function(item){

return Number(item.id) === Number(id);

}
);


if(existing){

existing.qty =
Number(existing.qty || 0) + 1;

}else{

cart.push({

id:product.id,

qty:1

});

}


saveCart(cart);

alert(
"✅ " +
product.name +
" কার্টে যোগ হয়েছে।"
);

}


/* =========================
   WISHLIST
========================= */

function toggleWish(id){

const wish = getWish();

const index =
wish.findIndex(
function(item){

return Number(item.id) === Number(id);

}
);


if(index >= 0){

wish.splice(index,1);

}else{

wish.push({
id:id
});

}


saveWish(wish);

renderProducts();

}


/* =========================
   IS WISHED
========================= */

function isWished(id){

return getWish().some(
function(item){

return Number(item.id) === Number(id);

}
);

}


/* =========================
   CATEGORY NAME
========================= */

function categoryName(cat){

const names = {

electronics:"ইলেকট্রনিক্স",

fashion:"ফ্যাশন",

beauty:"বিউটি",

home:"হোম",

kids:"কিডস"

};

return names[cat] || cat || "অন্যান্য";

}


/* =========================
   RENDER
========================= */

function renderProducts(){

const active =
document.querySelector(
".filter.active"
);

const category =
active
? active.dataset.cat
: "all";


const keyword =
document.getElementById(
"searchInput"
).value
.trim()
.toLowerCase();


let list =
products.filter(
function(product){

const categoryOK =
category === "all" ||
product.cat === category;


const productName =
String(
product.name || ""
).toLowerCase();


const searchOK =
!keyword ||
productName.includes(keyword);


return categoryOK &&
searchOK;

}
);


const sort =
document.getElementById(
"sort"
).value;


if(sort === "low"){

list.sort(
function(a,b){

return Number(a.price || 0) -
Number(b.price || 0);

}
);

}


if(sort === "high"){

list.sort(
function(a,b){

return Number(b.price || 0) -
Number(a.price || 0);

}
);

}


if(sort === "rating"){

list.sort(
function(a,b){

return Number(b.rating || 0) -
Number(a.rating || 0);

}
);

}


document.getElementById(
"resultText"
).textContent =
list.length +
"টি পণ্য পাওয়া গেছে";


const grid =
document.getElementById(
"productGrid"
);


if(list.length === 0){

grid.innerHTML = `

<div class="empty">

<div class="empty-icon">
🔍
</div>

<h2>
কোনো পণ্য পাওয়া যায়নি
</h2>

<p>
অন্য কিছু লিখে Search করুন।
</p>

</div>

`;

return;

}


grid.innerHTML =
list.map(
function(product){

const wished =
isWished(product.id);


return `

<div class="product-card">

<div class="product-image">

${product.emoji || "🛍️"}


<button
class="wish-btn ${wished ? "active" : ""}"
onclick="toggleWish(${product.id})"
title="Wishlist"
>

${wished ? "❤️" : "♡"}

</button>

</div>


<div class="product-info">

<div class="product-name">

${escapeHTML(product.name || "Product")}

</div>


<div class="rating">

⭐ ${Number(product.rating || 0).toFixed(1)}

</div>


<div class="price-row">

<span class="price">

${money(product.price)}

</span>


${
product.old
?
`<span class="old-price">${money(product.old)}</span>`
:
""
}

</div>


<div class="category">

${categoryName(product.cat)}

</div>


<div class="product-buttons">

<button
class="details-btn"
onclick="openProduct(${product.id})"
>
👁️ বিস্তারিত
</button>


<button
class="add-btn"
onclick="addToCart(${product.id})"
>
🛒 কার্টে
</button>

</div>

</div>

</div>

`;

}
).join("");

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   PRODUCT DETAILS
========================= */

function openProduct(id){

const product =
products.find(
function(item){

return Number(item.id) === Number(id);

}
);


if(!product){

return;

}


document.getElementById(
"modalImage"
).textContent =
product.emoji || "🛍️";


document.getElementById(
"modalName"
).textContent =
product.name || "Product";


document.getElementById(
"modalRating"
).textContent =
"⭐ " +
Number(product.rating || 0).toFixed(1);


document.getElementById(
"modalPrice"
).textContent =
money(product.price);


document.getElementById(
"modalOld"
).textContent =
product.old
? money(product.old)
: "";


document.getElementById(
"modalCategory"
).textContent =
"Category: " +
categoryName(product.cat);


document.getElementById(
"modalDescription"
).textContent =
product.description ||
"এই পণ্যের কোনো বিবরণ দেওয়া হয়নি।";


document.getElementById(
"modalAdd"
).onclick =
function(){

addToCart(product.id);

};


document.getElementById(
"productModal"
).classList.add("show");

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

document.getElementById(
"productModal"
).classList.remove("show");

}


/* =========================
   SEARCH
========================= */

document.getElementById(
"searchForm"
).addEventListener(
"submit",
function(event){

event.preventDefault();

renderProducts();

}
);


/* =========================
   SEARCH LIVE
========================= */

document.getElementById(
"searchInput"
).addEventListener(
"input",
function(){

renderProducts();

}
);


/* =========================
   FILTER
========================= */

document.querySelectorAll(
".filter"
).forEach(
function(button){

button.addEventListener(
"click",
function(){

document.querySelectorAll(
".filter"
).forEach(
function(item){

item.classList.remove(
"active"
);

}
);


button.classList.add(
"active"
);


renderProducts();

}
);

}
);


/* =========================
   SORT
========================= */

document.getElementById(
"sort"
).addEventListener(
"change",
function(){

renderProducts();

}
);


/* =========================
   CLOSE OUTSIDE
========================= */

document.getElementById(
"productModal"
).addEventListener(
"click",
function(event){

if(
event.target ===
this
){

closeModal();

}

}
);


/* =========================
   ESC CLOSE
========================= */

document.addEventListener(
"keydown",
function(event){

if(event.key === "Escape"){

closeModal();

}

}
);


/* =========================
   START
========================= */

document.addEventListener(
"DOMContentLoaded",
function(){

loadProducts();

updateCounts();

}
);

</script>

</body>
</html>
