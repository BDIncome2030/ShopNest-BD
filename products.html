<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Products — ShopNest BD</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  color:#182230;
  background:#fff;
}
a{text-decoration:none;color:inherit}
.container{width:min(1180px,92%);margin:auto}

.header{
  border-bottom:1px solid #eee;
  background:#fff;
}
.header-row{
  min-height:75px;
  display:flex;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.logo{
  font-size:25px;
  font-weight:800;
  white-space:nowrap;
}
.search{
  display:flex;
  flex:1;
  max-width:560px;
  border:1px solid #ddd;
  border-radius:25px;
  overflow:hidden;
}
.search input{
  flex:1;
  border:0;
  outline:0;
  padding:13px 18px;
  font-size:16px;
}
.search button{
  width:60px;
  border:0;
  background:#ed3042;
  color:white;
  font-size:20px;
}
.actions{
  display:flex;
  gap:15px;
  margin-left:auto;
}
.actions a{
  text-align:center;
  font-size:15px;
}
.badge{
  background:#ed3042;
  color:white;
  border-radius:20px;
  padding:2px 6px;
  font-size:11px;
}

.page{
  padding:25px 0 80px;
}
.breadcrumb{
  color:#888;
  margin-bottom:15px;
}
h1{
  font-size:30px;
  margin:10px 0 20px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.filter{
  border:1px solid #ddd;
  background:white;
  padding:9px 15px;
  border-radius:20px;
  cursor:pointer;
}
.filter.active{
  background:#ed3345;
  color:white;
  border-color:#ed3345;
}
select{
  padding:9px 12px;
  border:1px solid #ddd;
  border-radius:8px;
  margin-left:auto;
}

#resultText{
  color:#687586;
  margin-bottom:15px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}
.card{
  border:1px solid #e5e8ec;
  border-radius:12px;
  overflow:hidden;
  background:white;
}
.img{
  height:180px;
  background:#f5f7fa;
  display:grid;
  place-items:center;
  font-size:75px;
}
.info{
  padding:13px;
}
.name{
  font-weight:bold;
  min-height:40px;
}
.rating{
  color:#f39a00;
  font-size:13px;
  margin:5px 0;
}
.price{
  color:#e7353f;
  font-size:20px;
  font-weight:bold;
}
.old{
  color:#999;
  text-decoration:line-through;
  font-size:12px;
  margin-left:5px;
}
.add{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:8px;
  background:#ed3345;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.add:active{
  transform:scale(.98);
}

.bottom{
  display:none;
}

@media(max-width:900px){
  .product-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  body{
    padding-bottom:60px;
  }
  .header-row{
    padding:12px 0;
  }
  .logo{
    font-size:22px;
  }
  .search{
    order:3;
    flex-basis:100%;
    max-width:none;
  }
  .product-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .img{
    height:140px;
    font-size:60px;
  }
  .info{
    padding:10px;
  }
  select{
    margin-left:0;
  }
  .bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:60px;
    background:white;
    border-top:1px solid #ddd;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    z-index:100;
  }
  .bottom a{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:15px;
  }
  .bottom small{
    font-size:10px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="container header-row">

    <a class="logo" href="index.html">
      🛍️ ShopNest BD
    </a>

    <form class="search" id="searchForm">
      <input id="searchInput" placeholder="কি খুঁজছেন?">
      <button type="submit">🔍</button>
    </form>

    <div class="actions">
      <a href="cart.html">
        🛒<br>কার্ট
        <span class="badge" id="cartCount">0</span>
      </a>

      <a href="wishlist.html">
        ❤️<br>Wishlist
        <span class="badge" id="wishCount">0</span>
      </a>

      <a href="account.html">
        👤<br>Account
      </a>
    </div>

  </div>
</header>


<main class="container page">

  <div class="breadcrumb">
    <a href="index.html">Home</a> / Products
  </div>

  <h1>🛍️ সব পণ্য</h1>

  <div class="controls" id="filterRow">
    <button class="filter active" data-cat="all">সব</button>
    <button class="filter" data-cat="electronics">ইলেকট্রনিক্স</button>
    <button class="filter" data-cat="fashion">ফ্যাশন</button>
    <button class="filter" data-cat="beauty">বিউটি</button>
    <button class="filter" data-cat="home">হোম</button>
    <button class="filter" data-cat="kids">কিডস</button>

    <select id="sort">
      <option value="">সাজানো</option>
      <option value="low">কম দাম</option>
      <option value="high">বেশি দাম</option>
      <option value="rating">রেটিং</option>
    </select>
  </div>

  <div id="resultText"></div>

  <div id="productGrid" class="product-grid"></div>

</main>


<nav class="bottom">
  <a href="index.html">🏠<small>Home</small></a>
  <a href="cart.html">🛒<small>Cart</small></a>
  <a href="account.html">👤<small>Account</small></a>
</nav>


<script>

const CART_KEY = "shopnest_cart";
const WISH_KEY = "shopnest_wish";

const products = [

{
 id:1,
 name:"TWS ইয়ারবাডস",
 cat:"electronics",
 price:990,
 old:1800,
 rating:4.6,
 emoji:"🎧"
},

{
 id:2,
 name:"স্মার্ট ওয়াচ",
 cat:"electronics",
 price:1499,
 old:2500,
 rating:4.7,
 emoji:"⌚"
},

{
 id:3,
 name:"ল্যাপটপ ব্যাকপ্যাক",
 cat:"fashion",
 price:780,
 old:1200,
 rating:4.5,
 emoji:"🎒"
},

{
 id:4,
 name:"ক্যাজুয়াল স্নিকার্স",
 cat:"fashion",
 price:999,
 old:2000,
 rating:4.4,
 emoji:"👟"
},

{
 id:5,
 name:"স্কিন কেয়ার সেট",
 cat:"beauty",
 price:455,
 old:650,
 rating:4.8,
 emoji:"🧴"
},

{
 id:6,
 name:"স্মার্টফোন",
 cat:"electronics",
 price:15999,
 old:18500,
 rating:4.7,
 emoji:"📱"
},

{
 id:7,
 name:"ওয়্যারলেস হেডফোন",
 cat:"electronics",
 price:2200,
 old:3200,
 rating:4.6,
 emoji:"🎧"
},

{
 id:8,
 name:"ড্রেস কালেকশন",
 cat:"fashion",
 price:1290,
 old:1800,
 rating:4.5,
 emoji:"👗"
},

{
 id:9,
 name:"এয়ার ফ্রায়ার",
 cat:"home",
 price:3990,
 old:4500,
 rating:4.6,
 emoji:"🍳"
},

{
 id:10,
 name:"কিচেন ব্লেন্ডার",
 cat:"home",
 price:1850,
 old:2300,
 rating:4.3,
 emoji:"🥤"
},

{
 id:11,
 name:"মেকআপ কিট",
 cat:"beauty",
 price:1190,
 old:1600,
 rating:4.4,
 emoji:"💄"
},

{
 id:12,
 name:"বাচ্চাদের খেলনা গাড়ি",
 cat:"kids",
 price:850,
 old:1100,
 rating:4.7,
 emoji:"🚗"
},

{
 id:13,
 name:"টেডি বিয়ার",
 cat:"kids",
 price:690,
 old:900,
 rating:4.8,
 emoji:"🧸"
},

{
 id:14,
 name:"সানগ্লাস",
 cat:"fashion",
 price:650,
 old:900,
 rating:4.2,
 emoji:"🕶️"
},

{
 id:15,
 name:"টেবিল ল্যাম্প",
 cat:"home",
 price:950,
 old:1250,
 rating:4.5,
 emoji:"💡"
}

];


function money(n){
  return "৳ " + Number(n).toLocaleString("en-BD");
}


function getCart(){

  try{
    return JSON.parse(
      localStorage.getItem(CART_KEY) || "[]"
    );
  }catch(e){
    return [];
  }

}


function saveCart(cart){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(cart)
  );

  updateCounts();

}


function getWish(){

  try{
    return JSON.parse(
      localStorage.getItem(WISH_KEY) || "[]"
    );
  }catch(e){
    return [];
  }

}


function updateCounts(){

  const cart = getCart();

  const count = cart.reduce(
    (total,item)=>{
      return total + Number(item.qty || 0);
    },
    0
  );

  document.getElementById("cartCount").textContent = count;

  document.getElementById("wishCount").textContent =
    getWish().length;

}


function addToCart(id){

  let cart = getCart();

  let item = cart.find(
    x => Number(x.id) === Number(id)
  );

  if(item){

    item.qty = Number(item.qty || 0) + 1;

  }else{

    cart.push({
      id:id,
      qty:1
    });

  }

  saveCart(cart);

  alert("✅ পণ্য কার্টে যোগ হয়েছে");

}


function renderProducts(){

  let category =
    document.querySelector(".filter.active").dataset.cat;

  let search =
    document.getElementById("searchInput").value
    .trim()
    .toLowerCase();

  let list = products.filter(p=>{

    const categoryOK =
      category === "all" ||
      p.cat === category;

    const searchOK =
      !search ||
      p.name.toLowerCase().includes(search);

    return categoryOK && searchOK;

  });


  const sort =
    document.getElementById("sort").value;


  if(sort === "low"){
    list.sort((a,b)=>a.price-b.price);
  }

  if(sort === "high"){
    list.sort((a,b)=>b.price-a.price);
  }

  if(sort === "rating"){
    list.sort((a,b)=>b.rating-a.rating);
  }


  const grid =
    document.getElementById("productGrid");


  document.getElementById("resultText").textContent =
    list.length + "টি পণ্য পাওয়া গেছে";


  if(!list.length){

    grid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:50px">
        <div style="font-size:60px">🔍</div>
        <h2>কোনো পণ্য পাওয়া যায়নি</h2>
      </div>
    `;

    return;
  }


  grid.innerHTML = list.map(p=>`

    <div class="card">

      <div class="img">
        ${p.emoji}
      </div>

      <div class="info">

        <div class="name">
          ${p.name}
        </div>

        <div class="rating">
          ⭐ ${p.rating}
        </div>

        <div>
          <span class="price">
            ${money(p.price)}
          </span>

          <span class="old">
            ${money(p.old)}
          </span>
        </div>

        <button
          class="add"
          onclick="addToCart(${p.id})">
          🛒 কার্টে যোগ করুন
        </button>

      </div>

    </div>

  `).join("");

}


document.querySelectorAll(".filter").forEach(button=>{

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".filter")
      .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    renderProducts();

  });

});


document.getElementById("sort")
.addEventListener("change",renderProducts);


document.getElementById("searchForm")
.addEventListener("submit",function(e){

  e.preventDefault();

  renderProducts();

});


document.addEventListener(
  "DOMContentLoaded",
  function(){

    updateCounts();

    renderProducts();

  }
);

</script>

</body>
</html>
